<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Squadforces{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="nav">
  <a href="/" class="brand">
    <img src="/static/logo.svg" alt="" height="26" style="vertical-align:middle; margin-right:6px; position:relative; top:-1px;">Squadforces
  </a>
  <a href="/groups/">Groups</a>
  <div class="spacer"></div>
  <form method="post" action="/logout">
    <button>Sign out</button>
  </form>
</div>

<div id="page">
  {% block content %}{% endblock %}
</div>

</body>
</html>
