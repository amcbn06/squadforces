<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Squadforces</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="login-wrap">
  <div id="login-box">
    <img src="/static/logo.svg" alt="Squadforces" style="width:72px; display:block; margin:0 auto 10px;">
    <h1>Squadforces</h1>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '/' }}" />
      <div class="form-col" style="margin-bottom: 10px;">
        <label>Username</label>
        <input type="text" name="username" autofocus required autocomplete="username" />
      </div>
      <div class="form-col" style="margin-bottom: 14px;">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-green" style="width:100%;">Sign in</button>
    </form>
    <p style="text-align:center; margin-top:14px; font-size:13px; color:#888;">
      New here? <a href="/register">Create an account</a>
    </p>
  </div>
</div>
</body>
</html>
