{% extends "base.html" %}
{% block title %}Change password — Squadforces{% endblock %}

{% block content %}
<h1 style="margin-bottom:12px;">Change password</h1>

{% if changed %}
<div class="info-msg" style="max-width:420px;">Your password has been changed.</div>
{% endif %}
{% if error %}
<div class="error-msg" style="max-width:420px;">{{ error }}</div>
{% endif %}

<div class="box" style="max-width:420px;">
  <div class="box-body">
    <form method="post" action="/account/password">
      <div class="form-col" style="margin-bottom:10px;">
        <label>Current password</label>
        <input type="password" name="current_password" required autofocus autocomplete="current-password" />
      </div>
      <div class="form-col" style="margin-bottom:10px;">
        <label>New password <span class="meta">(at least {{ min_length }} characters)</span></label>
        <input type="password" name="new_password" required minlength="{{ min_length }}" autocomplete="new-password" />
      </div>
      <div class="form-col" style="margin-bottom:14px;">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="{{ min_length }}" autocomplete="new-password" />
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-green">Change password</button>
        <a href="/groups/" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
