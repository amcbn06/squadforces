<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Squadforces</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="login-wrap">
  <div id="login-box" style="max-width:360px;">
    <img src="/static/logo.svg" alt="Squadforces" style="width:72px; display:block; margin:0 auto 10px;">
    <h1>Create account</h1>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <p class="meta" style="margin-bottom:12px; font-size:12px; color:#888;">Login credentials</p>
      <div class="form-col" style="margin-bottom:10px;">
        <label>Username</label>
        <input type="text" name="username" autofocus required autocomplete="username" />
      </div>
      <div class="form-col" style="margin-bottom:10px;">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="new-password" />
      </div>
      <div class="form-col" style="margin-bottom:16px;">
        <label>Confirm password</label>
        <input type="password" name="password2" required autocomplete="new-password" />
      </div>

      <p class="meta" style="margin-bottom:12px; font-size:12px; color:#888;">Competitive programming profile</p>
      <div class="form-col" style="margin-bottom:10px;">
        <label>Full name</label>
        <input type="text" name="full_name" required placeholder="e.g. Andrei Ciobanu" />
      </div>
      <div class="form-col" style="margin-bottom:10px;">
        <label>Codeforces handle <span style="color:#e55; font-size:11px;">required</span></label>
        <input type="text" name="cf_handle" required placeholder="e.g. tourist" autocomplete="off" />
      </div>
      <div class="form-col" style="margin-bottom:10px;">
        <label>AtCoder handle <span class="meta" style="font-size:11px;">(optional)</span></label>
        <input type="text" name="atcoder_handle" placeholder="e.g. tourist" autocomplete="off" />
      </div>
      <div class="form-col" style="margin-bottom:16px;">
        <label>Kilonova handle <span class="meta" style="font-size:11px;">(optional)</span></label>
        <input type="text" name="kilonova_handle" placeholder="e.g. tourist" autocomplete="off" />
      </div>

      <button type="submit" class="btn btn-green" style="width:100%;">Create account</button>
    </form>
    <p style="text-align:center; margin-top:14px; font-size:13px; color:#888;">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
</body>
</html>
